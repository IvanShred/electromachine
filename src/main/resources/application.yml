server:
  port: 8090
  servlet:
    context-path: /electromachine

spring:
  datasource:
    url: jdbc:postgresql://localhost:5450/electromachine
    username: postgres
    password: postgres

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    url: jdbc:postgresql://localhost:5450/electromachine
    user: postgres
    password: postgres
    contexts: production

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/electromachine
          jwk-set-uri: http://keycloak:8080/realms/electromachine/protocol/openid-connect/certs

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

electromachine:
  ip:
    address: http://localhost

