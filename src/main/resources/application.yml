server:
  port: 8090
  servlet:
    context-path: /electromachine

spring:
  application:
    name: electromachine
  datasource:
    url: jdbc:postgresql://localhost:5450/electromachine
    username: postgres
    password: postgres

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    url: jdbc:postgresql://localhost:5450/electromachine
    user: postgres
    password: postgres
    contexts: production

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: electromachine-client
            client-secret: CyQfcFMsz7TFohoAKOu2wULxypspcT4S
            scope: openid,roles
            authorization-grant-type: authorization_code
            provider: keycloak
        provider:
          keycloak:
            issuer-uri: http://keycloak:8080/realms/electromachine
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/electromachine

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

electromachine:
  ip:
    address: http://localhost

logging:
  level:
    org.springframework.security.oauth2: TRACE
    org.springframework.security.web: DEBUG
    org.springframework.web.client: DEBUG
    com:
      vaadin: DEBUG