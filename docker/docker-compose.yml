version: "3.8"
services:
  postgres:
    image: postgres:16.1
    container_name: postgres
    ports:
      - "5450:5450"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=electromachine
      - PGPORT=5450
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d electromachine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: